services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 20

  ai-service:
    build: ./ai-service
    environment:
      AI_HOST: ${AI_HOST}
      AI_PORT: ${AI_PORT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      PROMPT_VERSION: ${PROMPT_VERSION}
      PDF_PAGE_CAP: ${PDF_PAGE_CAP}
    ports:
      - "${AI_PORT}:${AI_PORT}"

  backend:
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SERVER_HOST: ${SERVER_HOST}
      SERVER_PORT: ${SERVER_PORT}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      AI_SERVICE_URL: http://ai-service:${AI_PORT}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FOLDER: ${MAIL_FOLDER}
      MAIL_POLL_MS: ${MAIL_POLL_MS}
      WORKER_POLL_MS: ${WORKER_POLL_MS}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS}
      STORAGE_DIR: /app/storage
      REVIEWER_ID: ${REVIEWER_ID}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - backend-storage:/app/storage

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  mongo-data:
  backend-storage:
