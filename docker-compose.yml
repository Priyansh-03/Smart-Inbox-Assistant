# Every host/port/URL comes from the --env-file (.env by default, .env.local via `run.sh -local`).
# No literal hosts or ports in this file.
services:
  postgres:
    image: postgres:16
    command: ["-p", "${POSTGRES_PORT}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai-service:
    build: ./ai-service
    environment:
      AI_HOST: ${AI_HOST}
      AI_PORT: ${AI_PORT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      PROMPT_VERSION: ${PROMPT_VERSION}
      PDF_PAGE_CAP: ${PDF_PAGE_CAP}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS}
      OPENAI_MAX_RPM: ${OPENAI_MAX_RPM}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
    ports:
      - "${AI_PORT}:${AI_PORT}"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SERVER_HOST: ${SERVER_HOST}
      SERVER_PORT: ${SERVER_PORT}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FOLDER: ${MAIL_FOLDER}
      MAIL_POLL_MS: ${MAIL_POLL_MS}
      WORKER_POLL_MS: ${WORKER_POLL_MS}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS}
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB}
      MAX_IMPORT_REQUEST_MB: ${MAX_IMPORT_REQUEST_MB}
      MAX_BODY_CHARS: ${MAX_BODY_CHARS}
      STORAGE_DIR: /app/storage
      REVIEWER_ID: ${REVIEWER_ID}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - backend-storage:/app/storage

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: ${API_BASE_URL}
      NGINX_PORT: ${NGINX_PORT}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:${NGINX_PORT}"

volumes:
  pg-data:
  backend-storage:
