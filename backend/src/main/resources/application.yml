server:
  address: ${SERVER_HOST}
  port: ${SERVER_PORT}

spring:
  application:
    name: smart-inbox-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_ATTACHMENT_MB}MB
      max-request-size: ${MAX_IMPORT_REQUEST_MB}MB

app:
  storage-dir: ${STORAGE_DIR}
  reviewer-id: ${REVIEWER_ID}
  ingest:
    max-attachment-mb: ${MAX_ATTACHMENT_MB}
    max-body-chars: ${MAX_BODY_CHARS}
  worker:
    poll-ms: ${WORKER_POLL_MS}
    max-attempts: ${WORKER_MAX_ATTEMPTS}
  ai:
    base-url: ${AI_SERVICE_URL}
    timeout-seconds: ${AI_TIMEOUT_SECONDS}
  mail:
    enabled: ${MAIL_ENABLED}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    folder: ${MAIL_FOLDER}
    poll-ms: ${MAIL_POLL_MS}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

logging:
  level:
    com.clinevo.inbox: INFO
